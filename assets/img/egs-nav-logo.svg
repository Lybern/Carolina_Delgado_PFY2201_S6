<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Gradiente de fondo -->
    <linearGradient id="egsBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="50%" stop-color="#111c38" />
      <stop offset="100%" stop-color="#080d1a" />
    </linearGradient>

    <!-- Gradiente del borde neón -->
    <linearGradient id="egsNeonBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Gradiente cuerpo del mando -->
    <linearGradient id="egsPadGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Resplandor neón -->
    <filter id="egsGlowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#00f0ff" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Escudo / Contenedor exterior con esquinas redondeadas -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#egsBgGrad)" stroke="url(#egsNeonBorder)" stroke-width="2.5" />

  <!-- Detalle sutil de rejilla o arco superior -->
  <path d="M14 8 Q32 14 50 8" stroke="rgba(0, 240, 255, 0.25)" stroke-width="1.5" fill="none" stroke-linecap="round"/>

  <!-- Silueta de Control Gamer -->
  <g filter="url(#egsGlowFilter)">
    <!-- Cuerpo del mando -->
    <path d="M18 20 C18 16 23 14 32 14 C41 14 46 16 46 20 C46 25 49 32 45 35 C41 38 37 32 32 32 C27 32 23 38 19 35 C15 32 18 25 18 20 Z" 
          fill="url(#egsPadGrad)" 
          stroke="#00f0ff" 
          stroke-width="1.8" 
          stroke-linejoin="round" />

    <!-- D-Pad (Cruceta izquierda) -->
    <path d="M22 23.5 H28 M25 20.5 V26.5" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />

    <!-- Botones de Acción (Diamante derecho) -->
    <circle cx="41" cy="21.5" r="1.5" fill="#f59e0b" />
    <circle cx="38.5" cy="23.5" r="1.5" fill="#10b981" />
    <circle cx="43.5" cy="23.5" r="1.5" fill="#ef4444" />
    <circle cx="41" cy="25.5" r="1.5" fill="#3b82f6" />

    <!-- Botón central de encendido / LED -->
    <circle cx="32" cy="23.5" r="1.6" fill="#00f0ff" />
  </g>

  <!-- Monograma EGS Estilizado Inferior -->
  <text x="32" y="49" 
        text-anchor="middle" 
        fill="#ffffff" 
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" 
        font-weight="900" 
        font-size="11" 
        letter-spacing="2"
        style="text-shadow: 0 0 6px rgba(0, 240, 255, 0.8);">EGS</text>

  <!-- Punto acento cian -->
  <circle cx="47" cy="48" r="1.5" fill="#f59e0b" />
</svg>
